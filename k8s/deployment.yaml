apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-sre
  namespace: default
  labels:
    app: agentic-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-sre
  template:
    metadata:
      labels:
        app: agentic-sre
      annotations:
        admission.datadoghq.com/enabled: "true"
    spec:
      serviceAccountName: agentic-sre
      containers:
        - name: agentic-sre
          image: agentic-sre:latest
          ports:
            - containerPort: 8080
          env:
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: K8S_NAMESPACE
              value: "default"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
          envFrom:
            - secretRef:
                name: agentic-sre-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: agentic-sre-secrets
  namespace: default
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  DD_API_KEY: "REPLACE_ME"
  DD_APP_KEY: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
  PAGERDUTY_ROUTING_KEY: "REPLACE_ME"
  AGENT_WEBHOOK_SECRET: "REPLACE_ME"
