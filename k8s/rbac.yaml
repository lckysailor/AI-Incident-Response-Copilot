apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-sre
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-sre-remediator
  namespace: default
rules:
  # Read-only visibility used for diagnosis
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Narrow write access for remediation actions only -- no delete, no secrets
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-sre-remediator-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: agentic-sre
    namespace: default
roleRef:
  kind: Role
  name: agentic-sre-remediator
  apiGroup: rbac.authorization.k8s.io
