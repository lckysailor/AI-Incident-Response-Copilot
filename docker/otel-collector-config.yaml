receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, debug]
